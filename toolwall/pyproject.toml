[build-system]
# Pin hatchling below the release that emits Metadata-Version 2.4/2.5.
# PyPI's upload endpoint accepts up to 2.3; newer metadata is rejected with a 400.
requires = ["hatchling<1.27"]
build-backend = "hatchling.build"

[project]
name = "toolwall"
version = "0.4.2"
description = "Security gateway for AI agent tool calls: fail-closed schema + policy + secret-detection gate before any tool executes"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Mohammad Safwan Athar" }]
keywords = [
    "ai", "agents", "ai-agents", "llm", "llm-security", "ai-agent-security",
    "agent-security", "tool-calling", "tool-call-validation", "guardrails",
    "security", "ai-safety", "mcp", "mcp-security", "mcp-firewall", "mcp-proxy",
    "prompt-injection", "secret-detection", "agent-sandbox", "firewall",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.0.0"]
dev = ["pytest>=8.0", "pytest-cov>=4.0"]

[project.scripts]
toolwall = "toolwall.cli:main"

[project.urls]
Homepage = "https://github.com/Dev-Saif-Ops/toolwall"

[tool.hatch.build.targets.wheel]
packages = ["src/toolwall"]

[tool.hatch.build.targets.sdist]
include = ["src/toolwall", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
