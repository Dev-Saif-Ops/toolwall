name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests + attack suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e "./toolwall[dev]"
      - name: Tests (an un-awaited coroutine anywhere fails the run)
        working-directory: toolwall
        run: python -m pytest -q -W error::RuntimeWarning --cov=toolwall --cov-report=term-missing
      - name: Published attack suite (must stay at 100%)
        run: python gate-suite/run_suite.py
      - name: No-key demo
        run: python -m toolwall demo --no-color

  integrations:
    name: framework adapters (OpenAI Agents, Claude Agent SDK, LangChain, MCP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with every framework
        run: python -m pip install -e "./toolwall[dev,integrations]"
      - name: Adapter tests (must not skip)
        working-directory: toolwall
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q -W error::RuntimeWarning -rs tests/integrations | tee /tmp/int.txt
          ! grep -q SKIPPED /tmp/int.txt
      - name: MCP adapter on mcp 1.x
        working-directory: toolwall
        shell: bash
        run: |
          set -o pipefail
          python -m pip install "mcp>=1.0,<2"
          python -m pytest -q -W error::RuntimeWarning -rs tests/integrations/test_mcp.py | tee /tmp/mcp1.txt
          ! grep -q SKIPPED /tmp/mcp1.txt

  package:
    name: build + metadata check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        working-directory: toolwall
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Install the wheel in a clean env and import it
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install toolwall/dist/*.whl
          /tmp/clean/bin/python -c "import toolwall, pathlib; assert (pathlib.Path(toolwall.__file__).parent / 'py.typed').exists(); print(toolwall.__version__)"
          /tmp/clean/bin/python -m toolwall demo --no-color
